[build]
  command = "vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy transparente das rotas de backend (/api/*) para o servidor principal integrado
[[redirects]]
  from = "/api/*"
  to = "https://ais-pre-xxoymionfwyzqrkkm4w3x7-467353303181.us-east1.run.app/api/:splat"
  status = 200
  force = true

# Redirecionamento SPA (React Router / Views) para todas as rotas no domínio prudenempregos.com.br
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Content-Security-Policy = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://sdk.mercadopago.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; connect-src 'self' https:; frame-src 'self' https:;"
